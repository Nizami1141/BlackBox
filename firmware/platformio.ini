; ===========================================================================
;  ESP32-S3: терминал пограничного поста
;
;  pio run            собрать
;  pio run -t upload  прошить
;  pio device monitor смотреть лог
;
;  Про partitions: драйвер камеры, сетевой стек и Bluedroid вместе дают
;  довольно крупную прошивку, в стандартную схему разделов она не влезает.
;  huge_app.csv даёт ~3 МБ под приложение — этого хватает с запасом.
;
;  Про memory_type: qio_opi — для модулей с Octal PSRAM (N8R8, N16R8).
;  Если у вас Quad PSRAM (N8R2) — поставьте qio_qspi, иначе плата уйдёт
;  в бесконечную перезагрузку на старте.
; ===========================================================================

[platformio]
; По умолчанию собираем исходный общий вариант на одной ESP32-S3.
; Двухплатный вариант и диагностические профили сохранены ниже.
default_envs = esp32s3cam

[env:esp32s3cam]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200

; 921600 мост CH343 на этой плате не держит: esptool получает Write timeout
; от pySerial. 115200 медленно, но проходит всегда. Поднимайте постепенно,
; когда заливка станет стабильной.
upload_speed  = 115200

; Порт USB меняется после переподключения. Указывайте текущий COMn через
; --upload-port COMn при прошивке и -p COMn при запуске монитора.

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv

; Расшифровывает Backtrace из аварий в имена функций и номера строк.
; Без этого адреса вида 0x420b107e ничего не говорят.
monitor_filters = esp32_exception_decoder, time
extra_scripts = post:tools/w5500_spi_build.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DETH_DIRECT_AKS=1
    -DETH_AKS_HTTP=0
    ; Conservative clock for the W5500 wiring on this prototype.
    -DETH_SPI_CLOCK_HZ=1000000
    -DREGISTRY_ENABLED=0
    -DARDUINO_USB_MODE=1
    ; Основной разъём: встроенный USB-Serial/JTAG ESP32-S3 (COM3).
    ; Команды DEBUG_CHECK, JPEG и все сообщения Serial идут через него.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    +<*>
    -<*_main.cpp>

; ---------------------------------------------------------------------------
;  Зависимости
;
;  Ethernet — для W5500. Взята ОБЫЧНАЯ библиотека Arduino, а не ETH.h.
;  Нативная поддержка W5500 в ETH.h появилась только в ядре arduino-esp32
;  3.x, а здесь platform espressif32@6.x, то есть ядро 2.0.x. Обновление
;  ядра меняет драйвер камеры и поведение Bluetooth — ломать отлаженную
;  связку камера+сканер ради одной микросхемы не стоит.
;
;  ArduinoJson — разбор ответов сервера. Хватило бы и ручного поиска по
;  строке, но ответ содержит ФИО в UTF-8 и токен, и ошибиться на кавычке
;  здесь означало бы «иногда не узнаёт человека» вместо честной ошибки.
;
;  esp_camera.h входит в состав ядра arduino-esp32, отдельной строки не надо.
; ---------------------------------------------------------------------------
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    bblanchon/ArduinoJson@^7.0.4

; Если не хватит оперативной памяти в режиме BLE (симптом: перезагрузки при
; подключении клиента), замените встроенный Bluedroid на NimBLE — он
; экономит около 40 КБ RAM:
;   lib_deps = h2zero/NimBLE-Arduino@^1.4.1
;   и добавьте -DUSE_NIMBLE в build_flags
;
; В режиме Ethernet это неактуально: Bluedroid не поднимается вообще,
; и те же 70 КБ внутренней DRAM просто остаются свободными.

; ===========================================================================
; HTTPS AKS: совместимое имя основной сборки.
[env:esp32s3cam_https]
extends = env:esp32s3cam

; Внутренний HTTP разрешён только при явном выборе этого профиля.
[env:esp32s3cam_http]
extends = env:esp32s3cam
build_unflags =
    -DETH_AKS_HTTP=0
build_flags =
    ${env:esp32s3cam.build_flags}
    -DETH_AKS_HTTP=1

; ===========================================================================
; Прежний разъём USB-UART/CH343: отдельный профиль для UART0.
[env:esp32s3cam_uart]
extends = env:esp32s3cam
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${env:esp32s3cam.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; ===========================================================================
; Локальный стенд с ноутбуком: отдельная сборка сохраняет прежние адреса,
; опрос команды с сайта и Device Registry. Обычная esp32s3cam ходит в AKS.
[env:esp32s3cam_laptop]
extends = env:esp32s3cam
build_unflags =
    -DETH_DIRECT_AKS=1
    -DREGISTRY_ENABLED=0
build_flags =
    ${env:esp32s3cam.build_flags}
    -DETH_DIRECT_AKS=0
    -DREGISTRY_ENABLED=1

; ===========================================================================
;  НОВАЯ СХЕМА ИЗ ДВУХ ПЛАТ
; ===========================================================================

[env:camera_node_s3]
extends       = env:esp32s3cam
build_flags =
    ${env:esp32s3cam.build_flags}
    -DFW_ROLE_CAMERA_NODE=1
build_src_filter =
    +<*>
    -<*_main.cpp>
    -<ble_photo.cpp>
    -<button.cpp>
    -<checkpoint.cpp>
    -<eth_link.cpp>
    -<gm67.cpp>
    -<lcd.cpp>
    -<stream.cpp>

[env:gateway_wroom]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = huge_app.csv
build_flags =
    -DFW_ROLE_GATEWAY=1
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    +<*>
    -<*_main.cpp>
    -<ble_photo.cpp>
    -<camera.cpp>
    -<stream.cpp>
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------------------
; Автономная проверка только ESP32-S3-WROOM. Камера и внешние модули не
; компилируются и не нужны. Порт намеренно не задан: используйте
; --upload-port COMn и pio device monitor -p COMn.
[env:s3_healthcheck]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
; CH343 уже один раз оборвал длинную запись на 115200 сообщением
; "The chip stopped responding". Для диагностики важнее надёжность,
; поэтому шьём медленнее; на скорость самой программы это не влияет.
upload_speed  = 57600
monitor_filters = time
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    ; COM9 — это USB-UART мост CH343. Поэтому Serial должен идти в UART0,
    ; а не в нативный USB-CDC самого ESP32-S3.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFW_S3_HEALTHCHECK=1
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    -<*>
    +<healthcheck_main.cpp>

; Минимальная первая ступень для платы с нестабильной прошивкой. Не тянет
; Wi-Fi-библиотеку, поэтому образ заметно короче. Если даже этот образ
; обрывается на разных кабелях/портах, проблема почти наверняка аппаратная.
[env:s3_corecheck]
extends = env:s3_healthcheck
upload_speed = 38400
build_flags =
    ${env:s3_healthcheck.build_flags}
    -DHEALTHCHECK_RADIO=0

; Wi-Fi scan + настоящий двусторонний BLE GATT PING/PONG.
; Serial идёт через CH343/UART0, как и в corecheck.
[env:s3_commscheck]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 38400
monitor_filters = time
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFW_S3_COMMSCHECK=1
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    -<*>
    +<commscheck_main.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; Та же NimBLE-проверка, но загрузка и Serial идут через встроенный
; USB-Serial/JTAG ESP32-S3 (разъём USB/OTG, VID:PID 303A:1001), полностью
; минуя нестабильный мост CH343 на COM9.
[env:s3_commscheck_usb]
extends       = env:s3_commscheck
upload_speed  = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_S3_COMMSCHECK=1
    -DCORE_DEBUG_LEVEL=2

; Компактный BLE-only тест для единственного доступного порта CH343/COM9.
; Wi-Fi уже прошёл базовый healthcheck, поэтому здесь не линкуется.
[env:s3_blecheck]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
monitor_filters = time
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    -<*>
    +<blecheck_bluedroid_main.cpp>

; OV5640 + PSRAM + получение настоящего JPEG. Снимок передаётся через
; CH343/UART0, а tools/camera_capture_test.py сохраняет его на ноутбуке.
[env:s3_cameracheck]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    -<*>
    +<cameracheck_main.cpp>

; Полный стенд пользователя: OV5640 + LCD1602 I2C + GUI по CH343/COM9.
[env:s3_camera_lcd_test]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
monitor_filters = time
board_build.arduino.memory_type = qio_opi
