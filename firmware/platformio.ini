    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
build_src_filter =
    -<*>
    +<camera_lcd_test_main.cpp>
    +<lcd.cpp>

; Аппаратный тест всех пяти модулей на одной ESP32-S3 с OV5640.
[env:s3_all_hardware_test]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
monitor_filters = time
board_build.arduino.memory_type = qio_opi
