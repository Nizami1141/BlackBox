    +<all_hardware_test_main.cpp>
    +<lcd.cpp>
    +<gm67.cpp>
    +<button.cpp>
lib_deps =
    arduino-libraries/Ethernet@^2.0.2

; Проверка интерфейсов ESP32-S3 с перемычками без W5500/GM67/LCD/кнопки.
; Камера проверяется отдельно по настоящему SCCB + DVP кадру.
