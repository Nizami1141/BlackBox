# ============================================================================
#  Конфигурация сервера пограничного поста
#  Все относительные пути считаются от папки server/
# ============================================================================

server:
  host: "0.0.0.0"        # 0.0.0.0 — слушать все интерфейсы (нужно для постов по Ethernet)
  port: 8000

web:
  dir: "web"
  # Пульт оператора умеет заводить сотрудников и запускать проверки.
  # false = открыть его можно только на самом сервере (127.0.0.1).
  # Ставьте true осознанно и только в изолированной сети поста.
  allow_lan: false

# API из технического задания esp32.html. В тестовом стенде ноутбук является
# сервером 172.16.6.51, а ESP32+W5500 приходит с 172.16.6.52.
# allow_local_test разрешает тот же маршрут со страницы /selftest на самом
# ноутбуке; прочие IP по-прежнему получают 403.
aks_api:
  api_key: "Mass23e34rTYUm__55!QAAzxs"
  server_ip: "172.16.6.51"
  allow_local_test: true
  ip_devices:
    "172.16.6.52": "GATE-01"

# Настоящий AKS из esp32.html. При enabled=true ноутбук пересылает туда
# JPEG и штрихкод; локальное распознавание НЕ используется и при недоступном
# AKS проход запрещается. Для работы нужен маршрут через госcеть и одобренный
# исходящий IP ноутбука. Пока прямой кабель ESP32 и госcеть имеют одинаковую
# подсеть/адрес 172.16.6.51 на двух адаптерах, одновременно их включать нельзя.
# Включить после разведения подсетей и подтверждения whitelist у AKS.
central_aks:
  enabled: false
  base_url: "http://192.168.250.106/api"
  timeout_seconds: 30

storage:
  data_dir: "data"
  db_file: "data/checkpoint.db"
  # Хранить ли присланные с платы кадры (это биометрические ПДн!).
  # false = хранится только вектор. Для отладки можно временно true.
  keep_probe_images: false
  probe_dir: "data/probes"
  # Превью-фото сотрудника для интерфейса. Это не эталон, только для глаз оператора.
  keep_enroll_thumbnail: true

face:
  # backend: "insightface" — SCRFD + ArcFace (buffalo_l, 512-d).
  #     Всё считается локально на этом ноутбуке, наружу ничего не уходит.
  #     Первый запуск скачает ~300 МБ моделей в models/, дальше офлайн.
  #     Точнее OpenCV-варианта примерно на порядок по FAR при том же FRR —
  #     для КПП это и есть решающий аргумент.
  #
  # backend: "opencv" — YuNet + SFace (128-d). Ставится одним
  #     pip install opencv-contrib-python, ничего не качает сверх 37 МБ.
  #     Запасной путь, если insightface/onnxruntime не встал.
  #
  # ВНИМАНИЕ: размерность вектора у бэкендов разная (512 против 128).
  # После смены бэкенда базу нужно перерегистрировать заново —
  # сервер это заметит и скажет INDEX_MISMATCH, а не соврёт результатом.
  backend: "insightface"
  models_dir: "models"

  # Порог косинусной близости. ОБЯЗАТЕЛЬНО откалибровать на своей базе:
  #   python -m tools.calibrate_threshold
  # Ориентиры:
  #   insightface/buffalo_l (ArcFace)  0.40..0.50, здесь взят 0.45
  #   opencv/SFace                     0.363 по рекомендации OpenCV, строже — 0.42
  #
  # Отдельно про регистрацию с веб-камеры: эталон снят одной камерой,
  # а опознание идёт кадром с OV5640 — это разные оптика, баланс белого
  # и уровень шума. Схожесть у «того же самого» человека при этом падает
  # примерно на 0.03..0.07. Если пойдут ложные отказы, не опускайте порог
  # вслепую: сначала добавьте сотруднику 2–3 снимка, снятых уже платой
  # (кнопка «Добавить снимки» на странице сотрудников) — это честнее,
  # чем ослаблять порог для всех.
  threshold: 0.45

  # Размер входа детектора. 640 — «как в примерах», и он вчетверо дороже 320.
  # На посту лицо занимает половину кадра, 320 хватает с большим запасом.
  # Если распознавание тормозит — это первое, что стоит уменьшить.
  det_size: 320
  # До скольких пикселей по большей стороне ужимать кадр ПЕРЕД моделью.
  # Кадр с платы (640x480) не трогается, а снимки веб-камеры (1280x960)
  # ужимаются — на регистрации это была заметная часть времени.
  max_side: 800
  # Потоки onnxruntime. 0 = по умолчанию (все ядра). Ставьте 4, если сервер
  # мешает остальной работе ноутбука.
  threads: 0

  det_score_min: 0.65      # минимальная уверенность детектора
  min_face_px: 80          # мелкое лицо = мусорный вектор
  # Два лица в кадре на КПП — подозрительно, поэтому кадр отклоняется.
  allow_multiple_faces: false

liveness:
  # ЗАГЛУШКА. См. docs/ARCHITECTURE.md §3.2.
  # Сейчас систему проходит распечатанная фотография. Перед эксплуатацией — включить.
  enabled: false
  mode: "passive_stub"

session:
  # Сколько секунд действует токен, выданный после успешного опознания.
  ttl_seconds: 90
  # Сколько штрихкодов можно отсканировать в рамках одной сессии.
  # 1 = один сотрудник → один груз. Больше — если проверяют пачку.
  max_scans: 5

flow:
  photo_timeout: 15.0      # сколько ждём кадр от платы
  # Сколько ждём, что поднесут штрихкод.
  # ВНИМАНИЕ: пока сканер выключен (ENABLE_GM67 0 в прошивке), проверка
  # будет доходить до «Kodu skan edin» и заканчиваться таймаутом — это
  # правильное поведение, а не поломка. На время отладки экрана и камеры
  # удобно поставить 10, чтобы не ждать по три четверти минуты.
  scan_timeout: 45.0
  cooldown: 2.0            # пауза между проверками на одном посту
  # Короче этого — не штрихкод, а обрывок служебного кадра сканера.
  # В Host Mode сканер отвечает подтверждением на каждую команду, и байт
  # контрольной суммы после фильтрации выглядит как код из одного символа
  # ('(' или '$'). Такие обрывки отбрасываются, ожидание продолжается.
  #
  # БЫЛО 4. Служебный кадр 04 D0 04 00 FF 28 даёт максимум ДВА печатных
  # символа, так что 3 отсекает его гарантированно, а вот четырёхсимвольный
  # порог заодно съедал бы настоящий трёхсимвольный номер груза — молча,
  # с виду как «штрихкод не поднесли». Основную работу теперь делает вторая
  # проверка, по содержимому: в коде должна быть хотя бы одна буква или
  # цифра (core/flow.py, _looks_like_barcode).
  min_barcode_len: 3

# ============================================================================
#  ТЕКСТЫ НА ЭКРАНЕ ПОСТА (LCD 1602, азербайджанский)
#
#  Они здесь, а не в прошивке, специально: поправить формулировку можно,
#  не перепрошивая посты. Сервер шлёт строки как есть в UTF-8, а плата
#  переводит их в знакоместа HD44780 сама.
#
#  Строка экрана — 16 ЗНАКОВ. Считайте символы, а не байты: ə, ü, ö, ç, ş,
#  ğ, ı в UTF-8 занимают по два байта, но на экране это один знак.
#  Длиннее 16 обрежется.
#
#  Заглавные Ə Ö Ü Ç Ş Ğ выводятся строчными глифами: программируемых
#  знакомест у HD44780 всего восемь, и на заглавные их не хватило.
# ============================================================================
lcd:
  # Идёт съёмка
  wait1: "Kameraya baxın"
  wait2: "Gözləyin..."
  # Идёт поиск по базе
  search1: "Yoxlanılır..."
  search2: ""
  # Опознан: первая строка — фамилия и инициал, вторая — эта.
  # Это и есть главное сообщение: «отсканируйте штрихкод».
  ok2: "Kodu skan edin"
  # Не опознан
  deny1: "Giriş qadağandır"
  deny2: "Bazada yoxdur"
  # Груз записан: вторая строка — сам штрихкод
  saved1: "Yük qeyd edildi"
  # Ошибка и истёкшее время ожидания
  err1: "Xəta"
  timeout2: "Vaxt bitdi"
  # Сколько миллисекунд держать итоговое сообщение перед возвратом
  # к дежурному «нажмите кнопку» (дежурное живёт в прошивке).
  hold_ms: 4000

devices:
  # ВНИМАНИЕ: device_id и api_key должны состоять только из ASCII —
  # латиница, цифры, дефис. Они уезжают в заголовках HTTP, а заголовки
  # ничего другого не переносят: с кириллицей пост не сможет отправить
  # запрос вообще.
  #
  # Пост с реальной платой. device_id должен совпадать с CHECKPOINT_DEVICE_ID
  # в firmware/include/config.h, иначе сервер не примет ни кадр, ни штрихкод.
  - device_id: "GATE-01"
    api_key: "beta-key-gate-01-change-me"
    location: "КПП Астара, полоса 1"
    link:
      # АВТОНОМНЫЙ ПОСТ (Ethernet). Управляемого линка у него нет по замыслу:
      # инициатива у платы, она сама приходит на POST /api/recognize и
      # POST /api/log_cargo, предъявляя X-API-Key; device_id определяется
      # по адресу 172.16.6.52 из секции aks_api.ip_devices.
      #
      # Кнопка «Проверить» на сайте активна при регулярном опросе постом
      # /api/device/trigger. Физическая кнопка также продолжает работать.
      #
      # Соответствие с firmware/include/config.h:
      #     type: "none"   <->  ENABLE_ETH 1 и ENABLE_BLE 0
      #     type: "ble"    <->  ENABLE_BLE 1 и ENABLE_ETH 0
      # Разъедутся — пост будет виден, но проверки работать не будут.
      type: "none"
      # Настройки Bluetooth оставлены закомментированными: если вернётесь
      # к стендовому режиму, достаточно поменять type обратно на "ble".
      # ble_name: "ESP32S3-CAM"      # BLE_DEVICE_NAME из config.h
      # scan_timeout: 8.0            # сколько искать плату в эфире
      # retry_delay: 3.0

  # Пост-заглушка: весь сценарий целиком без единого провода.
  # Кадры берутся из data/fake_faces, штрихкод «читается» через 2 секунды.
  # Нужен, чтобы показать концепт и отлаживать сайт, не занимая Bluetooth.
  - device_id: "SIM-01"
    api_key: "beta-key-sim-01"
    location: "Эмулятор для демонстрации без железа"
    link:
      type: "fake"
      faces_dir: "data/fake_faces"
      scan_delay: 2.0

  # Так будет выглядеть пост на Ethernet, когда до него дойдут руки.
  # Плата сама открывает ws://<сервер>:8000/ws/device/GATE-02?key=<api_key>
  # - device_id: "GATE-02"
  #   api_key: "beta-key-gate-02"
  #   location: "КПП Астара, полоса 2"
  #   link:
  #     type: "ws"

logging:
  level: "INFO"
